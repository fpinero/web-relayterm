apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: relayterm-landing
  namespace: relayterm
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: relayterm.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: relayterm-landing
                port:
                  name: http
    - host: www.relayterm.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: relayterm-landing
                port:
                  name: http
